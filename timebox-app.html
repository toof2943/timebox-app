<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>TimeBox</title><style>
:root{--primary:#6366f1;--primary-dark:#4f46e5;--primary-light:#a5b4fc;--bg:#0f172a;--bg-card:#1e293b;--text:#f1f5f9;--text-muted:#94a3b8;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--border:#334155}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:0 16px 40px}
.header{position:sticky;top:0;z-index:100;background:rgba(15,23,42,.9);backdrop-filter:blur(12px);padding:16px 0 12px;border-bottom:1px solid var(--border)}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.header h1{font-size:24px;font-weight:700;background:linear-gradient(135deg,var(--primary-light),var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:4px;background:var(--bg-card);border-radius:10px;padding:3px}
.tab{flex:1;padding:8px;text-align:center;border:none;border-radius:8px;background:0 0;color:var(--text-muted);font-size:13px;font-weight:600;cursor:pointer}
.tab.active{background:var(--primary);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.btn-p{background:var(--primary);color:#fff}.btn-p:disabled{opacity:.5}
.btn-o{background:0 0;color:var(--primary-light);border:1px solid var(--primary)}
.btn-icon{width:36px;height:36px;padding:0;border-radius:10px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.card{background:var(--bg-card);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.input-group{margin-bottom:12px}
.input-group label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
input,select{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;font-family:inherit;outline:0}
input:focus,select:focus{border-color:var(--primary)}
.todo-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);border-radius:10px;margin-bottom:8px;border:1px solid var(--border)}
.todo-info{flex:1;min-width:0}.todo-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-dur{font-size:12px;color:var(--text-muted);margin-top:2px}
.todo-del{width:28px;height:28px;border:none;border-radius:8px;background:rgba(239,68,68,.1);color:var(--danger);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700}
.badge-h{background:rgba(239,68,68,.2);color:var(--danger)}.badge-m{background:rgba(245,158,11,.2);color:var(--warning)}.badge-l{background:rgba(34,197,94,.2);color:var(--success)}
.sch-item{display:flex;gap:12px;padding:14px;background:var(--bg);border-radius:12px;margin-bottom:8px;border-left:3px solid var(--primary);cursor:pointer}
.sch-item.active{border-left-color:var(--success);background:rgba(34,197,94,.05)}
.sch-item.completed{opacity:.5;border-left-color:var(--text-muted)}
.sch-item.blocked{border-left-color:var(--warning);background:rgba(245,158,11,.05);cursor:default}
.sch-time{flex-shrink:0;text-align:center;min-width:55px}
.sch-time .t{font-size:15px;font-weight:700;color:var(--primary-light)}
.sch-time .et{font-size:11px;color:var(--text-muted);margin-top:2px}
.sch-content{flex:1;min-width:0}
.sch-content .tn{font-size:15px;font-weight:600;margin-bottom:4px}
.sch-content .td{font-size:12px;color:var(--text-muted)}
.timer-c{text-align:center;padding:32px 16px}
.timer-ring{position:relative;width:220px;height:220px;margin:0 auto 24px}
.timer-ring svg{transform:rotate(-90deg)}
.timer-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.timer-digits{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums}
.timer-label{font-size:13px;color:var(--text-muted);margin-top:4px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer-ctrl{display:flex;gap:12px;justify-content:center;margin-top:20px}
.timer-ctrl .btn{padding:12px 28px;font-size:16px;border-radius:14px}
.empty{text-align:center;padding:48px 16px;color:var(--text-muted)}
.empty .ic{font-size:48px;margin-bottom:12px}
.empty p{font-size:14px}
.section-t{font-size:13px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px}
.inline-row{display:flex;gap:8px}.inline-row>*{flex:1}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:500}
.modal{background:var(--bg-card);border-radius:20px 20px 0 0;padding:24px 20px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-hdr h3{font-size:18px;font-weight:700}
.modal-cls{width:32px;height:32px;border:none;border-radius:50%;background:var(--bg);color:var(--text-muted);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-label{font-size:14px}.settings-label small{display:block;font-size:12px;color:var(--text-muted);margin-top:2px}
.toggle{width:44px;height:24px;background:var(--border);border-radius:12px;position:relative;cursor:pointer;border:none}
.toggle.on{background:var(--primary)}
.toggle::after{content:'';width:20px;height:20px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform .3s}
.toggle.on::after{transform:translateX(20px)}
.alarm-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.95);display:flex;align-items:center;justify-content:center;z-index:1000}
.alarm-content{text-align:center;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.alarm-icon{font-size:64px;margin-bottom:20px}
.alarm-title{font-size:24px;font-weight:700;margin-bottom:8px}
.alarm-sub{font-size:16px;color:var(--text-muted);margin-bottom:24px}
.gcal-bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.gcal-bar .btn{font-size:13px;padding:8px 14px}
.gcal-status{font-size:12px;color:var(--text-muted);flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcal-status.ok{color:var(--success)}
.gcal-status.err{color:var(--danger)}
.sch-item.gcal{border-left-color:#4285f4;background:rgba(66,133,244,.08)}
.sch-item.gcal .tn{color:#93b4f5}
.badge-gcal{background:rgba(66,133,244,.2);color:#93b4f5}
.gcal-section{margin-top:16px}
.gcal-input{display:flex;gap:8px;align-items:center}
.gcal-input input{flex:1;font-size:13px;padding:8px 10px}
.paste-area{width:100%;min-height:80px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-family:inherit;resize:vertical;outline:0}
.paste-area:focus{border-color:var(--primary)}
.paste-area::placeholder{color:var(--text-muted)}
.line-import{border-color:rgba(6,199,85,.3);background:rgba(6,199,85,.03)}
.line-event{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:8px;margin-bottom:6px;font-size:13px;border-left:3px solid #06c755}
.line-event .le-time{color:#06c755;font-weight:700;flex-shrink:0;min-width:100px}
.sch-item.line{border-left-color:#06c755;background:rgba(6,199,85,.08)}
.sch-item.line .tn{color:#6ee7a0}
.badge-line{background:rgba(6,199,85,.2);color:#6ee7a0}

const beep=()=>{try{const c=new(window.AudioContext||window.webkitAudioContext)();const n=c.currentTime;[0,1,2].forEach(i=>{const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;o.type='sine';g.gain.setValueAtTime(.3,n+i*.4);g.gain.exponentialRampToValueAtTime(.01,n+i*.4+.15);o.start(n+i*.4);o.stop(n+i*.4+.15);const o2=c.createOscillator();const g2=c.createGain();o2.connect(g2);g2.connect(c.destination);o2.frequency.value=1100;o2.type='sine';g2.gain.setValueAtTime(.3,n+i*.4+.15);g2.gain.exponentialRampToValueAtTime(.01,n+i*.4+.3);o2.start(n+i*.4+.15);o2.stop(n+i*.4+.3)});return c}catch(e){return null}};
const notify=(t,b)=>{if('Notification'in window&&Notification.permission==='granted')new Notification(t,{body:b,tag:'tb'})};
const t2m=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const m2t=m=>{const h=Math.floor(m/60);const mn=m%60;return String(h).padStart(2,'0')+':'+String(mn).padStart(2,'0')};
const fmt=s=>{const m=Math.floor(s/60);const sc=s%60;return String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0')};

// LINE予定テキストパーサー
function parseLineSchedule(text){
  const events=[];
  // 【...の予定】ヘッダーと HH:MM〜HH:MM　タイトル のパターンを検出
  const timePattern=/(\d{1,2}:\d{2})\s*[〜~\-]\s*(\d{1,2}:\d{2})\s*[　\s]+(.+?)(?=\d{1,2}:\d{2}\s*[〜~\-]|【|$)/g;
  // テキストからヘッダーを除去して処理
  const cleaned=text.replace(/【[^】]*】/g,' ');
  let m;
  while((m=timePattern.exec(cleaned))!==null){
    const startStr=m[1].length===4?'0'+m[1]:m[1];
    const endStr=m[2].length===4?'0'+m[2]:m[2];
    const name=m[3].trim();
    if(!name)continue;
    const startMin=t2m(startStr);
    const endMin=t2m(endStr);
    if(endMin<=startMin)continue;
    events.push({
      id:'line-'+Date.now()+'-'+events.length,
      name:name,
      start:startStr,
      end:endStr,
      dur:endMin-startMin,
      st:'pending',
      line:true
    });
  }
  // 重複除去（同じ開始時間+名前）
  const seen=new Set();
  return events.filter(e=>{
    const key=e.start+e.name;
    if(seen.has(key))return false;
    seen.add(key);
    return true;
  });
}

const GCAL_SCOPES='https://www.googleapis.com/auth/calendar.readonly';
const GCAL_DISCOVERY='https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest';

function useGoogleCalendar(clientId,autoSync=false,syncInterval=5){
  const[gcalState,setGcalState]=useState({authed:false,loading:false,events:[],error:null,lastSync:null});
  const tokenClientRef=useRef(null);
  const gapiInitedRef=useRef(false);

  const initGapi=useCallback(()=>{
    if(!clientId||gapiInitedRef.current)return Promise.resolve();
    return new Promise((resolve,reject)=>{
      if(!window.gapi){reject(new Error('Google API not loaded'));return}
      window.gapi.load('client',async()=>{
        try{
          await window.gapi.client.init({discoveryDocs:[GCAL_DISCOVERY]});
          gapiInitedRef.current=true;
          resolve();
        }catch(e){reject(e)}
      });
    });
  },[clientId]);

  const fetchEvents=useCallback(async()=>{
    setGcalState(p=>({...p,loading:true,error:null}));
    try{
      const now=new Date();
      const startOfDay=new Date(now.getFullYear(),now.getMonth(),now.getDate());
      const endOfDay=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
      const resp=await window.gapi.client.calendar.events.list({
        calendarId:'primary',
        timeMin:startOfDay.toISOString(),
        timeMax:endOfDay.toISOString(),
        singleEvents:true,
        orderBy:'startTime',
        maxResults:50
      });
      const events=(resp.result.items||[])
        .filter(e=>e.start&&e.start.dateTime&&e.end&&e.end.dateTime)
        .map(e=>{
          const s=new Date(e.start.dateTime);
          const en=new Date(e.end.dateTime);
          const startMin=s.getHours()*60+s.getMinutes();
          const endMin=en.getHours()*60+en.getMinutes();
          return{
            id:'gcal-'+e.id,
            name:e.summary||'(\u7121\u984c)',
            start:m2t(startMin),
            end:m2t(endMin),
            dur:endMin-startMin,
            st:'pending',
            gcal:true,
            gcalId:e.id,
            description:e.description||'',
            location:e.location||''
          };
        })
        .filter(e=>e.dur>0);
      const syncTime=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
      setGcalState(p=>({...p,loading:false,events,lastSync:syncTime,authed:true}));
    }catch(e){
      if(e.status===401){
        setGcalState(p=>({...p,loading:false,authed:false,error:'\u8a8d\u8a3c\u304c\u5207\u308c\u307e\u3057\u305f\u3002\u518d\u63a5\u7d9a\u3057\u3066\u304f\u3060\u3055\u3044'}));
      }else{
        setGcalState(p=>({...p,loading:false,error:'\u53d6\u5f97\u5931\u6557: '+(e.result?.error?.message||e.message||'\u4e0d\u660e\u306a\u30a8\u30e9\u30fc')}));
      }
    }
  },[]);

  const signIn=useCallback(async()=>{
    if(!clientId){setGcalState(p=>({...p,error:'Client ID\u304c\u672a\u8a2d\u5b9a\u3067\u3059'}));return}
    setGcalState(p=>({...p,loading:true,error:null}));
    try{
      await initGapi();
      if(!tokenClientRef.current){
        tokenClientRef.current=window.google.accounts.oauth2.initTokenClient({
          client_id:clientId,
          scope:GCAL_SCOPES,
          callback:async(resp)=>{
            if(resp.error){
              setGcalState(p=>({...p,loading:false,error:'\u8a8d\u8a3c\u306b\u5931\u6557\u3057\u307e\u3057\u305f: '+resp.error}));
              return;
            }
            setGcalState(p=>({...p,authed:true}));
            await fetchEvents();
          }
        });
      }
      tokenClientRef.current.requestAccessToken({prompt:''});
    }catch(e){
      setGcalState(p=>({...p,loading:false,error:'\u521d\u671f\u5316\u306b\u5931\u6557: '+e.message}));
    }
  },[clientId,initGapi,fetchEvents]);

  const signOut=useCallback(()=>{
    const token=window.gapi?.client?.getToken();
    if(token){window.google.accounts.oauth2.revoke(token.access_token)}
    window.gapi?.client?.setToken(null);
    tokenClientRef.current=null;
    setGcalState({authed:false,loading:false,events:[],error:null,lastSync:null});
  },[]);

  // Auto-sync interval
  useEffect(()=>{
    if(!autoSync||!gcalState.authed||!clientId)return;
    const ms=Math.max(syncInterval,1)*60*1000;
    const id=setInterval(()=>{fetchEvents()},ms);
    return()=>clearInterval(id);
  },[autoSync,syncInterval,gcalState.authed,clientId,fetchEvents]);

  return{...gcalState,signIn,signOut,fetchEvents};
}

function App(){
  const[tab,setTab]=useState('todos');
  const[todos,setTodos]=useState([]);
  const[schedule,setSch]=useState([]);
  const[showAdd,setShowAdd]=useState(false);
  const[showSettings,setShowSettings]=useState(false);
  const[alarm,setAlarm]=useState(null);
  const[activeIdx,setActiveIdx]=useState(-1);
  const[remain,setRemain]=useState(0);
  const[running,setRunning]=useState(false);
  const timerRef=useRef(null);
  const alarmRef=useRef(null);
  const[settings,setS]=useState(()=>{
    try{const s=localStorage.getItem('tb-settings');const d={start:'09:00',end:'18:00',brk:5,sound:true,notif:true,autoNext:false,gcalClientId:'',gcalAutoSync:false,gcalSyncInterval:5,gcalReminderMin:5};return s?{...d,...JSON.parse(s)}:d}
    catch(e){return{start:'09:00',end:'18:00',brk:5,sound:true,notif:true,autoNext:false,gcalClientId:'',gcalAutoSync:false,gcalSyncInterval:5,gcalReminderMin:5}}
  });

  useEffect(()=>{localStorage.setItem('tb-settings',JSON.stringify(settings))},[settings]);

  const gcal=useGoogleCalendar(settings.gcalClientId,settings.gcalAutoSync,settings.gcalSyncInterval);
  const[lineEvents,setLineEvents]=useState([]);
  const[showPaste,setShowPaste]=useState(false);
  const[pasteText,setPasteText]=useState('');

  const importLineEvents=()=>{
    const parsed=parseLineSchedule(pasteText);
    if(parsed.length===0)return;
    setLineEvents(parsed);
    setPasteText('');
    setShowPaste(false);
  };
  const clearLineEvents=()=>setLineEvents([]);

  useEffect(()=>{if('Notification'in window&&Notification.permission!=='granted')Notification.requestPermission()},[]);

  useEffect(()=>{
    if(running&&remain>0){
      timerRef.current=setInterval(()=>{
        setRemain(p=>{
          if(p<=1){clearInterval(timerRef.current);setRunning(false);onComplete();return 0}
          return p-1;
        });
      },1000);
    }
    return()=>clearInterval(timerRef.current);
  },[running]);

  const onComplete=()=>{
    const task=schedule[activeIdx];if(!task)return;
    if(settings.sound){alarmRef.current=beep()}
    if(settings.notif){notify('\u23f0 \u5b8c\u4e86!','\u300c'+task.name+'\u300d\u306e\u6642\u9593\u3067\u3059')}
    setAlarm(task);
    setSch(p=>p.map((s,i)=>i===activeIdx?{...s,st:'done'}:s));
  };

  const dismissAlarm=()=>{
    if(alarmRef.current){alarmRef.current.close();alarmRef.current=null}
    setAlarm(null);
    if(settings.autoNext&&activeIdx+1<schedule.length)startTask(activeIdx+1);
  };

  // Reminder notifications for upcoming events (Google Calendar + LINE)
  const notifiedRef=useRef(new Set());
  useEffect(()=>{
    const allEvents=[...(gcal.authed?gcal.events:[]),...lineEvents];
    if(!settings.notif||allEvents.length===0)return;
    const reminderMin=settings.gcalReminderMin||5;
    if(reminderMin===0)return;
    const checkReminders=()=>{
      const now=new Date();
      const nowMin=now.getHours()*60+now.getMinutes();
      allEvents.forEach(e=>{
        const eStart=t2m(e.start);
        const diff=eStart-nowMin;
        if(diff>0&&diff<=reminderMin&&!notifiedRef.current.has(e.id)){
          notifiedRef.current.add(e.id);
          if(settings.sound)beep();
          const icon=e.line?'💬':'📅';
          notify(icon+' まもなく予定',e.start+'〜 '+e.name+(e.location?' @ '+e.location:''));
        }
      });
    };
    checkReminders();
    const id=setInterval(checkReminders,30000);
    return()=>clearInterval(id);
  },[gcal.events,gcal.authed,lineEvents,settings.notif,settings.gcalReminderMin,settings.sound]);

  const addTodo=t=>{setTodos(p=>[...p,{id:Date.now(),...t}]);setShowAdd(false)};
  const delTodo=id=>setTodos(p=>p.filter(t=>t.id!==id));

  const genSchedule=(useGcal=false,useLine=false)=>{
    const sm=t2m(settings.start),em=t2m(settings.end),bd=settings.brk;
    const gcalEvts=useGcal?gcal.events
      .filter(e=>{const es=t2m(e.start),ee=t2m(e.end);return ee>sm&&es<em})
      .map(e=>({...e,start:m2t(Math.max(t2m(e.start),sm)),end:m2t(Math.min(t2m(e.end),em)),dur:Math.min(t2m(e.end),em)-Math.max(t2m(e.start),sm)}))
      .sort((a,b)=>t2m(a.start)-t2m(b.start)):[];
    const lineEvts=useLine?lineEvents
      .filter(e=>{const es=t2m(e.start),ee=t2m(e.end);return ee>sm&&es<em})
      .map(e=>({...e,start:m2t(Math.max(t2m(e.start),sm)),end:m2t(Math.min(t2m(e.end),em)),dur:Math.min(t2m(e.end),em)-Math.max(t2m(e.start),sm)}))
      .sort((a,b)=>t2m(a.start)-t2m(b.start)):[];
    const calEvents=[...gcalEvts,...lineEvts].sort((a,b)=>t2m(a.start)-t2m(b.start));

    if(!todos.length&&!calEvents.length)return;

    const blocked=calEvents.map(e=>({s:t2m(e.start),e:t2m(e.end)}));
    const freeSlots=[];
    let cursor=sm;
    for(const b of blocked){
      if(cursor<b.s)freeSlots.push({s:cursor,e:b.s});
      cursor=Math.max(cursor,b.e);
    }
    if(cursor<em)freeSlots.push({s:cursor,e:em});

    const po={high:0,medium:1,low:2};
    const sorted=[...todos].sort((a,b)=>(po[a.pri]||1)-(po[b.pri]||1));

    const ns=[...calEvents];
    let slotIdx=0,slotCur=freeSlots.length>0?freeSlots[0].s:em;
    for(const t of sorted){
      const d=t.dur||25;
      while(slotIdx<freeSlots.length&&slotCur+d>freeSlots[slotIdx].e){
        slotIdx++;
        if(slotIdx<freeSlots.length)slotCur=freeSlots[slotIdx].s;
      }
      if(slotIdx>=freeSlots.length)break;
      ns.push({id:'t-'+t.id,name:t.name,start:m2t(slotCur),end:m2t(slotCur+d),dur:d,pri:t.pri,st:'pending'});
      slotCur+=d+bd;
    }
    ns.sort((a,b)=>t2m(a.start)-t2m(b.start));
    setSch(ns);setTab('schedule');
  };

  const handleGcalSync=async()=>{
    if(!gcal.authed){await gcal.signIn();return}
    await gcal.fetchEvents();
  };

  const startTask=i=>{
    const t=schedule[i];if(!t||t.st==='done')return;
    setActiveIdx(i);setRemain(t.dur*60);setRunning(true);
    setSch(p=>p.map((s,j)=>j===i?{...s,st:'active'}:s));
    setTab('timer');
  };

  const skipTask=()=>{
    clearInterval(timerRef.current);setRunning(false);
    setSch(p=>p.map((s,i)=>i===activeIdx?{...s,st:'done'}:s));
    if(activeIdx+1<schedule.length)startTask(activeIdx+1);
    else{setActiveIdx(-1);setTab('schedule')}
  };

  const totalMin=todos.reduce((s,t)=>s+(t.dur||25),0);
  const gcalMin=gcal.events.reduce((s,e)=>s+e.dur,0);
  const lineMin=lineEvents.reduce((s,e)=>s+e.dur,0);
  const availMin=t2m(settings.end)-t2m(settings.start);
  const freeMin=availMin-gcalMin-lineMin;

  return React.createElement('div',{className:'app'},
    React.createElement('div',{className:'header'},
      React.createElement('div',{className:'header-top'},
        React.createElement('h1',null,'\u23f1 TimeBox'),
        React.createElement('div',{style:{display:'flex',gap:6}},
          settings.gcalClientId&&React.createElement('button',{
            className:'btn-icon',
            onClick:handleGcalSync,
            title:'Google Calendar\u540c\u671f',
            style:gcal.authed?{borderColor:'#4285f4',color:'#4285f4'}:{}
          },gcal.loading?'\u23f3':'\ud83d\udcc5'),
          React.createElement('button',{className:'btn-icon',onClick:()=>setShowSettings(true)},'\u2699')
        )
      ),
      React.createElement('div',{className:'tabs'},
        React.createElement('button',{className:'tab'+(tab==='todos'?' active':''),onClick:()=>setTab('todos')},'Todo'),
        React.createElement('button',{className:'tab'+(tab==='schedule'?' active':''),onClick:()=>setTab('schedule')},'\u30b9\u30b1\u30b8\u30e5\u30fc\u30eb'),
        React.createElement('button',{className:'tab'+(tab==='timer'?' active':''),onClick:()=>setTab('timer')},'\u30bf\u30a4\u30de\u30fc')
      )
    ),
    React.createElement('div',{style:{paddingTop:16}},
      tab==='todos'&&React.createElement('div',null,
        gcal.authed&&gcal.events.length>0&&React.createElement('div',{className:'card',style:{marginBottom:12,borderColor:'rgba(66,133,244,.3)'}},
          React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},
            React.createElement('div',{style:{fontSize:13,fontWeight:700,color:'#93b4f5'}},'\ud83d\udcc5 Google Calendar ('+gcal.events.length+'\u4ef6)'),
            React.createElement('span',{className:'gcal-status ok'},'\u6700\u7d42\u540c\u671f: '+gcal.lastSync)
          ),
          gcal.events.slice(0,3).map(e=>React.createElement('div',{key:e.id,style:{fontSize:13,color:'var(--text-muted)',padding:'4px 0',borderTop:'1px solid var(--border)'}},
            React.createElement('span',{style:{color:'#93b4f5',marginRight:8}},e.start+'-'+e.end),e.name
          )),
          gcal.events.length>3&&React.createElement('div',{style:{fontSize:11,color:'var(--text-muted)',paddingTop:4}},'\u4ed6 '+(gcal.events.length-3)+'\u4ef6...')
        ),
        // LINE取り込みカード
        React.createElement('div',{className:'card line-import',style:{marginBottom:12}},
          React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:lineEvents.length>0||showPaste?8:0}},
            React.createElement('div',{style:{fontSize:13,fontWeight:700,color:'#06c755'}},'💬 LINE予定取り込み'+(lineEvents.length>0?' ('+lineEvents.length+'件)':'')),
            React.createElement('div',{style:{display:'flex',gap:6}},
              lineEvents.length>0&&React.createElement('button',{className:'btn btn-o',style:{fontSize:11,padding:'3px 8px',borderColor:'#ef4444',color:'#ef4444'},onClick:clearLineEvents},'クリア'),
              React.createElement('button',{className:'btn btn-o',style:{fontSize:11,padding:'3px 8px',borderColor:'#06c755',color:'#06c755'},onClick:()=>setShowPaste(!showPaste)},showPaste?'閉じる':'貼り付け')
            )
          ),
          showPaste&&React.createElement('div',{style:{marginBottom:8}},
            React.createElement('textarea',{className:'paste-area',value:pasteText,onChange:e=>setPasteText(e.target.value),placeholder:'LINEの予定メッセージをここに貼り付け\n例: 08:00〜22:45　ブロック\n09:30〜10:00　面談リマインド',rows:4}),
            React.createElement('button',{className:'btn btn-p',style:{width:'100%',marginTop:6,fontSize:13,background:'#06c755'},onClick:importLineEvents,disabled:!pasteText.trim()},'取り込む')
          ),
          lineEvents.length>0&&lineEvents.slice(0,5).map(e=>React.createElement('div',{key:e.id,className:'line-event'},
            React.createElement('span',{className:'le-time'},e.start+'〜'+e.end),
            React.createElement('span',{style:{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},e.name)
          )),
          lineEvents.length>5&&React.createElement('div',{style:{fontSize:11,color:'var(--text-muted)',paddingTop:4}},'他 '+(lineEvents.length-5)+'件...')
        ),
        (todos.length>0||gcal.events.length>0||lineEvents.length>0)&&React.createElement('div',{className:'card',style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
          React.createElement('div',null,
            React.createElement('div',{style:{fontSize:13,color:'var(--text-muted)'}},'\u5408\u8a08\u898b\u7a4d\u3082\u308a'),
            React.createElement('div',{style:{fontSize:20,fontWeight:700}},Math.floor(totalMin/60)+'h '+totalMin%60+'m',
              React.createElement('span',{style:{fontSize:13,color:totalMin>(gcal.authed?freeMin:availMin)?'var(--danger)':'var(--success)',marginLeft:8}},
                '/ '+Math.floor((gcal.authed?freeMin:availMin)/60)+'h'+(gcal.authed?freeMin:availMin)%60+'m\u5229\u7528\u53ef\u80fd'
              )
            ),
            gcal.authed&&gcalMin>0&&React.createElement('div',{style:{fontSize:11,color:'#93b4f5',marginTop:2}},'(\u30ab\u30ec\u30f3\u30c0\u30fc: '+Math.floor(gcalMin/60)+'h'+gcalMin%60+'m)'),
            lineMin>0&&React.createElement('div',{style:{fontSize:11,color:'#06c755',marginTop:2}},'(LINE\u4e88\u5b9a: '+Math.floor(lineMin/60)+'h'+lineMin%60+'m)')
          ),
          React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:6}},
            (lineEvents.length>0||(gcal.authed&&gcal.events.length>0))&&React.createElement('button',{className:'btn btn-p',onClick:()=>genSchedule(gcal.authed&&gcal.events.length>0,lineEvents.length>0),style:{fontSize:12,padding:'6px 12px',background:lineEvents.length>0?'#06c755':'#4285f4'}},(lineEvents.length>0?'\ud83d\udcac':'')+(gcal.authed&&gcal.events.length>0?'\ud83d\udcc5':'')+' \u4e88\u5b9a\u8fbc\u307f'),
            React.createElement('button',{className:'btn btn-p',onClick:()=>genSchedule(false,false),style:{fontSize:12,padding:'6px 12px'}},'\u26a1 \u81ea\u52d5\u914d\u7f6e')
          )
        ),
        React.createElement('div',{className:'section-t'},'\u30bf\u30b9\u30af\u4e00\u89a7'),
        todos.length===0?React.createElement('div',{className:'empty'},React.createElement('div',{className:'ic'},'\ud83d\udcdd'),React.createElement('p',null,'\u30bf\u30b9\u30af\u3092\u8ffd\u52a0\u3057\u3066',React.createElement('br'),'\u30bf\u30a4\u30e0\u30dc\u30af\u30b7\u30f3\u30b0\u3092\u59cb\u3081\u307e\u3057\u3087\u3046')):
        todos.map(t=>React.createElement('div',{key:t.id,className:'todo-item'},
          React.createElement('div',{className:'todo-info'},
            React.createElement('div',{className:'todo-name'},t.name),
            React.createElement('div',{className:'todo-dur'},'\u23f0 '+t.dur+'\u5206 ',React.createElement('span',{className:'badge badge-'+(t.pri==='high'?'h':t.pri==='medium'?'m':'l')},t.pri==='high'?'\u9ad8':t.pri==='medium'?'\u4e2d':'\u4f4e'))
          ),
          React.createElement('button',{className:'todo-del',onClick:()=>delTodo(t.id)},'\u2715')
        )),
